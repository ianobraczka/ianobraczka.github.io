<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo escuro com cantos suavemente arredondados -->
  <rect width="64" height="64" rx="14" fill="#090a0f" />
  
  <!-- Borda sutil de vidro -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#1f2430" />

  <!-- Letra "I" estilizada / Traço de pipeline -->
  <rect x="18" y="18" width="7" height="28" rx="3.5" fill="#f4f4f5" />

  <!-- Letra "O" estilizada / Nó de infraestrutura -->
  <circle cx="39" cy="32" r="10.5" stroke="#f4f4f5" stroke-width="6" />

  <!-- Ponto conector esmeralda (Status / Compilação ativa) -->
  <circle cx="39" cy="32" r="3.5" fill="#10b981" />
</svg>